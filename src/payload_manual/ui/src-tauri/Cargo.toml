[package]
name = "payload-manual-controller"
version = "0.1.0"
description = "D3K BLE manual controller for the cargo payload"
authors = ["CIA"]
edition = "2026"

[lib]
name = "payload_manual_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.7", default-features = false }
