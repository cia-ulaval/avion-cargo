[workspace]
resolver = "2"
members = [
    "../../../payload_manual/ui/src-tauri",
    "../../../payload_manual_trilateration/ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
authors = ["CIA"]
edition = "2021"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.7", default-features = false }
