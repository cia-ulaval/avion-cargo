services:
  dev:
    environment:
      AVION_WORLD: /workspace/avion-cargo/simulation/worlds/payload_manual.sdf
      AVION_SIM_SERVICES: "avion-gazebo avion-payload-manual avion-payload-manual-ui"
      AVION_SIM_STARTUP_DELAY: "3"
      AVION_MANUAL_PAYLOAD_CONFIG: /workspace/avion-cargo/simulation/config/manual_payload_config.json
      AVION_MANUAL_PAYLOAD_UART_DEVICE: /tmp/payload-anchor
      AVION_MANUAL_CONTROLLER_PEER_ID: "2"
      AVION_MANUAL_MAX_WHEEL_SURFACE_VELOCITY_M_S: "0.12"
      AVION_MANUAL_MAX_LINEAR_SPEED_M_S: "0.15"
      AVION_MANUAL_MAX_ANGULAR_SPEED_RAD_S: "0.8"
